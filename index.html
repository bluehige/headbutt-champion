<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>박치기 챔피언</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --red: #D62B1F; --gold: #F2B632; --navy: #14213D; --paper: #F7F3E8; --ink: #1B1B1B;
      --kr: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    html, body { margin: 0; height: 100%; background: #0b0f1c; overflow: hidden; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: "Pretendard", var(--kr); }
    #stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 50% 50%; }
    #game { position: absolute; inset: 0; width: 1280px; height: 720px; display: block; background: var(--navy); }

    /* 터치 버튼: 터치 기기 + 경기 중에만 보임 */
    .pad { display: none; position: absolute; }
    body.touch.in-match .pad { display: block; }
    .tbtn {
      position: absolute; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; border: 4px solid rgba(247,243,232,0.85);
      background: rgba(20,33,61,0.55); color: var(--paper);
      font-family: "Black Han Sans", var(--kr); font-size: 26px; line-height: 1.05; text-align: center;
      touch-action: none;
    }
    .tbtn.on { background: rgba(214,43,31,0.8); transform: scale(0.94); }
    #padL { left: 20px; top: 400px; width: 300px; height: 140px; }
    #padL .tbtn { width: 128px; height: 128px; top: 6px; font-size: 44px; border-radius: 22px; }
    #padL [data-btn="left"] { left: 0; }
    #padL [data-btn="right"] { left: 150px; }
    #padR { right: 20px; top: 360px; width: 380px; height: 350px; }
    #padR [data-btn="headbutt"] { width: 170px; height: 170px; right: 0; bottom: 10px; background: rgba(214,43,31,0.6); border-color: var(--gold); font-size: 34px; }
    #padR [data-btn="duck"] { width: 120px; height: 120px; right: 190px; bottom: 0; }
    #padR [data-btn="back"] { width: 120px; height: 120px; right: 190px; bottom: 132px; font-size: 22px; }
    #padR .skill { width: 78px; height: 58px; border-radius: 12px; top: 0; font-size: 18px; border-width: 3px; }
    #padR [data-btn="q"] { right: 196px; }
    #padR [data-btn="w"] { right: 98px; }
    #padR [data-btn="e"] { right: 0; }
    #padR .skill small { display: block; font-size: 12px; font-family: "Pretendard", var(--kr); }

    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: var(--navy); color: var(--paper);
      font: 24px "Black Han Sans", var(--kr); align-items: center; justify-content: center; text-align: center; }
    @media (orientation: portrait) { body.touch #rotate { display: flex; } }
    #fileWarn { position: fixed; left: 0; right: 0; top: 0; z-index: 20; padding: 14px; background: var(--red); color: var(--paper);
      font: 700 16px "Pretendard", var(--kr); text-align: center; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>
    <div class="pad" id="padL">
      <div class="tbtn" data-btn="left">◀</div>
      <div class="tbtn" data-btn="right">▶</div>
    </div>
    <div class="pad" id="padR">
      <div class="tbtn skill" data-btn="q">Q<small>이환이형</small></div>
      <div class="tbtn skill" data-btn="w">W<small>금강불괴</small></div>
      <div class="tbtn skill" data-btn="e">E<small>원거리</small></div>
      <div class="tbtn" data-btn="back">물러<br />서기</div>
      <div class="tbtn" data-btn="duck">숙이기</div>
      <div class="tbtn" data-btn="headbutt">박치기</div>
    </div>
  </div>
  <div id="rotate">가로 화면으로 돌려 주세요</div>
  <div id="fileWarn" hidden>파일을 직접 열면(file://) 동작하지 않습니다. 이 폴더에서 <b>node serve.mjs</b> 를 실행한 뒤 http://localhost:5173/ 으로 여세요.</div>
  <script>if (location.protocol === 'file:') document.getElementById('fileWarn').hidden = false;</script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
